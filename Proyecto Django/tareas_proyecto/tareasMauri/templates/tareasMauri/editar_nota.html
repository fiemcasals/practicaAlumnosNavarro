{% extends "base.html" %}
{% block title %}Editar Nota{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>✏️ Editar Nota</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">💾 Guardar cambios</button>
            <a class="btn btn-secondary" href="{% url 'tareasMauri:notas' %}">⬅ Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
